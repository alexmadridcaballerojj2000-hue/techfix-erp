<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechFix ERP - Control de Inventario y Gestión para Taller de Computación</title>
  <meta name="description" content="Sistema empresarial de control de inventario, registro de compras, almacenamiento de facturas fotografiadas y kardex para talleres de reparación de computadoras.">

  <!-- Tailwind CSS CDN con Configuración Personalizada -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfeff',
              100: '#cffafe',
              400: '#22d3ee',
              500: '#06b6d4',
              600: '#0891b2',
              900: '#164e63',
            },
            accent: {
              500: '#8b5cf6',
              600: '#7c3aed',
            },
            dark: {
              bg: '#07090e',
              surface: '#0e131f',
              card: '#141b2d',
              border: 'rgba(255, 255, 255, 0.08)'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- React 18 & Dependencies -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js para Estadísticas -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- SheetJS para Exportación a Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- html2pdf.js para Exportar Reportes en PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Estilos Personalizados del Sistema -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#07090e] text-gray-100 min-h-screen selection:bg-cyan-500 selection:text-black">
  <div id="root"></div>

  <!-- Aplicación Principal React -->
  <script type="text/babel" src="app.js"></script>
</body>
</html>
